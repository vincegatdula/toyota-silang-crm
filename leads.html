<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Leads — Toyota CRM Silang Cavite">
  <meta name="theme-color" content="#eb0a1e">
  <title>Leads · Toyota CRM</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/leads.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="leads">
  <main class="content">
    <div class="page-head">
      <div>
        <h2>Leads</h2>
        <div class="sub" id="lead-count"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="btn ghost js-export" aria-label="Export leads to CSV">Export CSV</button>
        <button type="button" class="btn primary js-add">+ Add Lead</button>
      </div>
    </div>

    <div class="toolbar leads-toolbar">
      <div class="search-box">
        <span class="search-ic"></span>
        <input type="search" id="lead-search" placeholder="Search ID, name, mobile, vehicle, email…" aria-label="Search leads">
      </div>
      <select id="f-status" aria-label="Filter by status">
        <option value="">All statuses</option>
      </select>
      <select id="f-stage" aria-label="Filter by pipeline stage">
        <option value="">All stages</option>
      </select>
      <select id="f-priority" aria-label="Filter by priority">
        <option value="">All priorities</option>
      </select>
      <select id="f-source" aria-label="Filter by source">
        <option value="">All sources</option>
      </select>
    </div>

    <div class="chip-row" id="lead-chips" style="margin-bottom:12px"></div>

    <div id="lead-list" class="lead-card-list"></div>
    <div class="table-wrap" id="lead-table-wrap">
      <table class="data" id="lead-table">
        <thead>
          <tr>
            <th>ID</th><th>Customer</th><th>Contact</th><th>Vehicle</th><th>Source</th>
            <th>Stage</th><th>Status</th><th>Priority</th><th>Next Follow-up</th><th>Next Step</th>
          </tr>
        </thead>
        <tbody id="lead-tbody"></tbody>
      </table>
    </div>
    <div class="empty hidden" id="lead-empty">No leads match your filters.</div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/leadview.js"></script>
  <script src="js/leads.js"></script>
</body>
</html>
