<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sales & lead-generation targets — Toyota CRM Silang Cavite">
  <meta name="theme-color" content="#eb0a1e">
  <title>Targets · Toyota CRM</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="targets">
  <main class="content">
    <div class="page-head">
      <div>
        <h2>Targets</h2>
        <div class="sub" id="tgt-sub"></div>
      </div>
      <button type="button" class="btn primary js-save">Save Targets</button>
    </div>

    <div class="tgt-grid">
      <div class="card">
        <div class="card-head">
          <h2>Monthly Sales Target</h2>
          <span class="k-sec" id="tgt-month"></span>
        </div>
        <div class="card-body">
          <div class="form-grid">
            <div class="field"><label>Sales Target <span class="req">*</span></label><input type="number" id="t-sales" min="0" placeholder="Units this month"></div>
            <div class="field"><label>Working Days <small class="muted">(leave 0 for auto)</small></label><input type="number" id="t-wd" min="0"></div>
            <div class="field"><label>Closing Ratio <small class="muted">%</small></label><input type="number" id="t-cr" min="1" max="100"></div>
          </div>
          <div class="tgt-sm-note muted">Closing ratio is used to estimate how many leads you need to close the remaining deals.</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h2>Sales Performance</h2></div>
        <div class="card-body">
          <div class="tgt-kpis" id="tgt-kpis"></div>
          <div class="ach-row" id="tgt-ach" style="margin-top:14px"></div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-head"><h2>Lead Generation Targets</h2><span class="k-sec">per source</span></div>
      <div class="card-body">
        <div class="table-wrap on-mobile-cards">
          <table class="data leadgen-table">
            <thead>
              <tr><th>Source</th><th>Target</th><th>Actual</th><th>Remaining</th><th>Required / Day</th><th>Progress</th></tr>
            </thead>
            <tbody id="lg-tbody"></tbody>
          </table>
        </div>
        <div class="tgt-sm-note muted" id="lg-totals"></div>
      </div>
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/leadview.js"></script>
  <script src="js/targets.js"></script>
</body>
</html>
